<!DOCTYPE html>
<html>
<head>
<title>Security Awareness Training</title>

<style>
body{
    font-family: Arial;
    background:#0b1e2d;

}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#132f4c;
    padding:20px;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,229,255,0.3);
}

h1{
    color:#00e5ff;
    text-align:center;
}

h3{
    color:#00e5ff;
}

iframe{
    width:100%;
    height:400px;
    border-radius:10px;
    border:none;
}

.btn{
    background:#00e5ff;
    color:black;
    padding:12px 20px;
    text-decoration:none;
    border-radius:8px;
    display:inline-block;
    margin-top:20px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>Employee Security Awareness Training</h1>

<div class="card">

<iframe src="https://www.youtube.com/embed/XBkzBrXlle0" allowfullscreen></iframe>

</div>

</html>
