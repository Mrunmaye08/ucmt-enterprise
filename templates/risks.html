<!DOCTYPE html>
<html>
<head>
<title>Risk Management</title>

<style>
body{
    font-family: Arial;
    background:#0b1e2d;
    color:white;
    padding:20px;
}

h2{
    color:#00e5ff;
}

/* FORM */
input, select{
    padding:10px;
    margin:8px;
    border-radius:5px;
    border:none;
}

button{
    padding:10px 20px;
    background:#00e5ff;
    border:none;
    font-weight:bold;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#00c2d1;
}

/* TABLE */
table{
    width:100%;
    margin-top:20px;
    background:#132f4c;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#00e5ff;
    color:black;
}

th, td{
    padding:12px;
    border-bottom:1px solid #1e4d6b;
    text-align:center;
}

/* SEVERITY COLORS */
.high{ color:#ff4d4d; font-weight:bold; }
.medium{ color:#ffaa00; font-weight:bold; }
.low{ color:#00e676; font-weight:bold; }

/* BACK BUTTON */
a{
    color:#00e5ff;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<h2>🚨 Risk Management</h2>

<form method="POST">

<select name="risk" required>
<option value="">Select Risk</option>
<option>No Security Policy</option>
<option>Weak Password Policy</option>
<option>No Backup Strategy</option>
<option>No Risk Management Policy</option>
<option>Employee awareness training is missing</option>
<option>Open Ports Detected</option>
<option value="custom">Custom Risk</option>
</select>

<input type="text" name="custom_risk" placeholder="If custom, type here">

<select name="severity">
<option value="High">High</option>
<option value="Medium">Medium</option>
<option value="Low">Low</option>
</select>

<button type="submit">Add Risk</button>

</form>

<h3>📋 Existing Risks</h3>

<table>
<tr>
<th>Risk</th>
<th>Severity</th>
<th>ISO Control</th>
</tr>

{% for r in risks %}
<tr>
<td>{{r.name}}</td>

<td class="{{r.severity|lower}}">
{{r.severity}}
</td>

<td>
{% if r.control %}
{{r.control}}
{% else %}
Not Mapped
{% endif %}
</td>

</tr>
{% endfor %}

</table>

<br>
<a href="/dashboard">⬅ Back to Dashboard</a>

</body>
</html>
